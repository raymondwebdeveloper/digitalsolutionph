<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Solution | Lead Generation, Web Design & Development</title>
    <meta
      name="description"
      content="Digital Solution offers expert web design, development, lead generation, and optimization services to help your business succeed online."
    />
    <link rel="canonical" href="https://digitalsolutionph.co/" />
    <link
      rel="shortcut icon"
      href="/assets/img/logo/digitalSolution_icon.svg"
      type="image/x-icon"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- css -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-J8BNGPTBJL"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-J8BNGPTBJL");
    </script>
  </head>

  <body class="bg-secondary text-white">
    <div class="container mt-5">
      <div
        class="card bg-dark text-white p-4 shadow-sm mx-auto"
        style="max-width: 400px"
      >
        <a href="https://digitalsolutionph.co" class="nav-link">
          <img src="assets/img/logo/logo.svg" alt="" />
          <span class="text-white fs-40 bold ml-3">DIGITAL SOLUTION</span>
        </a>
        <h3 class="text-center mb-3">Create Account</h3>
        <form id="signupForm">
          <input
            type="email"
            class="form-control mb-3"
            id="signupEmail"
            placeholder="Email"
            required
          />
          <input
            type="password"
            class="form-control mb-3"
            id="signupPassword"
            placeholder="Password"
            required
          />
          <button type="submit" class="btn btn-orange w-100">Sign Up</button>
        </form>
        <p class="text-center mt-3">
          Already have an account?
          <a href="login.html" class="text-orange">Login</a>
        </p>
      </div>
    </div>

    <script type="module" src="/firebase.js"></script>
    <script type="module">
      import { auth, createUserWithEmailAndPassword } from "./firebase.js";

      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("signupEmail").value;
          const password = document.getElementById("signupPassword").value;

          try {
            await createUserWithEmailAndPassword(auth, email, password);
            alert("Signup successful! Redirecting...");
            window.location.href = "login.html";
          } catch (error) {
            alert(error.message);
          }
        });
    </script>
  </body>
</html>

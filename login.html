<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- css -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-secondary text-white">
    <div class="container mt-5">
        <div class="card bg-dark text-white p-4 shadow-sm mx-auto" style="max-width: 400px;">
            <a href="https://digitalsolutionph.co" class="nav-link">
                <img src="assets/img/logo/logo.svg" alt="">
                <span class="text-white fs-40 bold ml-3">DIGITAL SOLUTION</span>
            </a>
            <h3 class="text-center mb-3">Login</h3>
            <form id="loginForm">
                <input type="email" class="form-control mb-3" id="loginEmail" placeholder="Email" required />
                <input type="password" class="form-control mb-3" id="loginPassword" placeholder="Password" required />
                <button type="submit" class="btn btn-orange w-100">Login</button>
            </form>
            <p class="text-center mt-3">
                Don’t have an account? <a href="signup.html" class="text-orange">Sign Up</a>
            </p>
        </div>
    </div>

    <script type="module" src="firebase.js"></script>
    <script type="module">
        import { auth, signInWithEmailAndPassword } from "./firebase.js";

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Login successful!");
                window.location.href = "dashboard.html";
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>

</html>
